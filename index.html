<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="LabX - Centralized Computer Resource Utilization and Performance Monitoring Platform for College Laboratories">
  <meta name="author" content="LabX Team">
  <title>LabX — Computer Lab Monitoring Platform</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- CSS Design System -->
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>

  <!-- App Root -->
  <div id="app"></div>

  <!-- Toast Container -->
  <div class="toast-container" id="toast-container"></div>

  <!-- Modal Overlay -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-title">Modal</h3>
        <button class="btn btn-icon btn-ghost" onclick="App.closeModal()">
          <i data-lucide="x"></i>
        </button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-footer" id="modal-footer"></div>
    </div>
  </div>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Core JS -->
  <script src="js/data.js"></script>
  <script src="js/components.js"></script>
  <script src="js/charts.js"></script>

  <!-- Page Modules -->
  <script src="js/pages/login.js"></script>
  <script src="js/pages/dashboard.js"></script>
  <script src="js/pages/laboratories.js"></script>
  <script src="js/pages/computers.js"></script>
  <script src="js/pages/performance.js"></script>
  <script src="js/pages/alerts.js"></script>
  <script src="js/pages/reports.js"></script>
  <script src="js/pages/users.js"></script>
  <script src="js/pages/settings.js"></script>
  <script src="js/pages/architecture.js"></script>

  <!-- App Router -->
  <script src="js/app.js"></script>

</body>
</html>
